<!-- Шапка графика. Слева — что меряет ось Y, справа — за какой период
     ряд и то, чем его переключают (проецируется местом вызова).
     Период обязателен: линия без границ ряда не говорит, «за последнюю
     неделю» это или «за всё время».

     В сжатом виде шапки нет: там график стоит подписанной строкой в
     карточке, и вторая подпись над ним повторяла бы её. -->
@if (!compact()) {
  <div class="lchead">
    @if (yLabel()) {
      <span class="ylab">{{ yLabel() }}</span>
    }
    @if (span(); as s) {
      <span class="span">с {{ s.from | date: 'd MMM' }} по {{ s.to | date: 'd MMM' }}</span>
    }
    <ng-content />
  </div>
}

<svg
  [attr.viewBox]="'0 0 ' + W() + ' ' + height()"
  role="img"
  [attr.aria-label]="label()"
  preserveAspectRatio="xMidYMid meet"
>
  <!-- Сетка с подписями значений: без них у линии нет масштаба, и
       «выросло» невозможно отличить от «выросло вдвое». -->
  @if (!compact()) {
    @for (t of yTicks(); track t.y) {
      <line class="grid" [attr.x1]="PL()" [attr.x2]="W() - PR()" [attr.y1]="t.y" [attr.y2]="t.y" />
      <text class="tick" [attr.x]="PL() - 8" [attr.y]="t.y + 3.5" text-anchor="end">
        {{ t.value | number }}
      </text>
    }
  }

  <!-- Кусками, а не одной линией: на месте пропущенных дней линия
       рвётся. Ноль мы измерили, пропущенный день — нет, и любая линия
       через него — выдумка. -->
  @for (s of segments(); track s.key) {
    @if (!compact()) {
      <path class="area" [attr.d]="s.area" />
    }
    <polyline class="line" [attr.points]="s.line" [style.stroke]="color() || null" />
  }

  @for (d of visibleDots(); track d.date) {
    <circle
      class="dot"
      [attr.cx]="d.x"
      [attr.cy]="d.y"
      [attr.r]="dotRadius()"
      [style.fill]="color() || null"
    />
  }

  @if (!compact()) {
    <line
      class="axis"
      [attr.x1]="PL()"
      [attr.x2]="W() - PR()"
      [attr.y1]="axisY()"
      [attr.y2]="axisY()"
    />

    @for (t of xTicks(); track t.date) {
      <text class="tick" [attr.x]="t.x" [attr.y]="height() - 8" text-anchor="middle">
        {{ t.date | date: 'd MMM' }}
      </text>
    }

    <!-- Значение по наведению. Колонка на всю высоту, а не сам узел: в
         точку радиусом два пикселя курсором не попасть. -->
    @for (h of hits(); track h.date) {
      <rect
        class="hit"
        [attr.x]="h.hx"
        [attr.y]="PT()"
        [attr.width]="h.hw"
        [attr.height]="axisY() - PT()"
      >
        <title>{{ h.date | date: 'd MMM' }}: {{ sign() }}{{ h.value | number }}</title>
      </rect>
    }
  }
</svg>
