<app-header />

<!-- Разделы — горизонтальными вкладками, как в админке и в кабинете
     пользователя. Боковое меню занимало пятую часть экрана под две
     ссылки, а канбан и карточка проекта упирались в остаток ширины. -->
<div class="manager-layout">
  <nav class="crm-page nav" aria-label="Разделы менеджера">
    <div class="tabs">
      <a
        class="tab"
        routerLink="/manager"
        routerLinkActive="on"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Заявки
      </a>
      <!-- Не exact: вкладка остаётся подсвеченной и внутри карточки
           проекта — иначе, открыв проект, менеджер теряет, где он. -->
      <a class="tab" routerLink="/manager/projects" routerLinkActive="on">Мои проекты</a>
      <a class="tab" routerLink="/manager/board" routerLinkActive="on">Канбан</a>
      <a class="tab" routerLink="/manager/templates" routerLinkActive="on">Шаблоны</a>
      <span class="sp"></span>
      <button type="button" class="tab logout-btn" (click)="logout()">Выйти</button>
    </div>
  </nav>

  <main class="content">
    <ng-content></ng-content>
  </main>
</div>
