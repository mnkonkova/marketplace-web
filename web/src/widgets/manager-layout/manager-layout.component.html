<app-header />

<div class="manager-layout" [class.sidebar-open]="sidebarOpen()">
  <button
    type="button"
    class="hamburger"
    [attr.aria-label]="sidebarOpen() ? 'Закрыть меню' : 'Открыть меню'"
    [attr.aria-expanded]="sidebarOpen()"
    (click)="toggleSidebar()"
  >
    <span nz-icon [nzType]="sidebarOpen() ? 'close' : 'menu'" nzTheme="outline"></span>
  </button>

  @if (sidebarOpen()) {
    <div class="backdrop" (click)="closeSidebar()"></div>
  }

  <aside class="sidebar">
    <a routerLink="/manager" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      <span nz-icon nzType="inbox" nzTheme="outline"></span> Входящие
    </a>
    <a routerLink="/manager/board" routerLinkActive="is-active">
      <span nz-icon nzType="appstore" nzTheme="outline"></span> Канбан
    </a>
    <div class="spacer"></div>
    <button type="button" class="logout-btn" (click)="logout()">
      <span nz-icon nzType="logout" nzTheme="outline"></span> Выйти
    </button>
  </aside>
  <main class="content">
    <ng-content></ng-content>
  </main>
</div>
