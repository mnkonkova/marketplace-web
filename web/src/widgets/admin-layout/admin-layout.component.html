<app-header />

<div class="admin-layout" [class.sidebar-open]="sidebarOpen()">
  <button
    type="button"
    class="hamburger"
    [attr.aria-label]="sidebarOpen() ? 'Закрыть меню' : 'Открыть меню'"
    [attr.aria-expanded]="sidebarOpen()"
    (click)="toggleSidebar()"
  >
    <span nz-icon [nzType]="sidebarOpen() ? 'close' : 'menu'" nzTheme="outline"></span>
  </button>

  @if (sidebarOpen()) {
    <div class="backdrop" (click)="closeSidebar()"></div>
  }

  <aside class="sidebar">
    <a routerLink="/admin/productions" routerLinkActive="is-active">
      <span nz-icon nzType="bank" nzTheme="outline"></span> Продакшены
    </a>
    <a routerLink="/admin/managers" routerLinkActive="is-active">
      <span nz-icon nzType="team" nzTheme="outline"></span> Менеджеры
    </a>
    <a routerLink="/admin/users" routerLinkActive="is-active">
      <span nz-icon nzType="contacts" nzTheme="outline"></span> Пользователи
    </a>
    <a routerLink="/admin/pipelines" routerLinkActive="is-active">
      <span nz-icon nzType="branches" nzTheme="outline"></span> Воронки
    </a>
    <a routerLink="/admin/projects" routerLinkActive="is-active">
      <span nz-icon nzType="ordered-list" nzTheme="outline"></span> Проекты
    </a>
    <a routerLink="/admin/board" routerLinkActive="is-active">
      <span nz-icon nzType="appstore" nzTheme="outline"></span> Канбан
    </a>
    <a routerLink="/admin/moderation" routerLinkActive="is-active" class="with-badge">
      <span nz-icon nzType="safety-certificate" nzTheme="outline"></span>
      Модерация
      @if (pendingModeration() > 0) {
        <span class="badge">{{ pendingModeration() }}</span>
      }
    </a>
    <a routerLink="/admin/dashboard" routerLinkActive="is-active">
      <span nz-icon nzType="dashboard" nzTheme="outline"></span> Дашборд
    </a>
    <div class="spacer"></div>
    <button type="button" class="logout-btn" (click)="logout()">
      <span nz-icon nzType="logout" nzTheme="outline"></span> Выйти
    </button>
  </aside>
  <main class="content">
    <ng-content></ng-content>
  </main>
</div>
