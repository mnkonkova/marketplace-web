@if (visible()) {
  <div class="cookie-banner" role="dialog" aria-label="Согласие на cookies">
    <div class="cookie-banner__text">
      <strong>Cookies и аналитика.</strong>
      Мы используем файлы cookies и собираем статистику, чтобы маркетплейс
      работал корректно и мы могли его улучшать.
      <!-- TODO: routerLink="/legal/privacy" когда страница политики появится -->
    </div>
    <div class="cookie-banner__actions">
      <button type="button" class="cookie-banner__btn cookie-banner__btn--secondary" (click)="acceptEssential()">
        Только необходимые
      </button>
      <button type="button" class="cookie-banner__btn cookie-banner__btn--primary" (click)="acceptAll()">
        Принять все
      </button>
    </div>
  </div>
}
