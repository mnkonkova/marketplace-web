<!-- Лента 2× со смешанными форматами. Каждая плитка держит собственный
     aspect-ratio, поэтому вертикаль, горизонталь и квадрат уживаются в одной
     сетке без кропа. Клик открывает лайтбокс — inline-плеера в теле нет. -->
<div class="feed-grid">
  @for (p of items(); track p.id; let i = $index) {
    @let poster = posterSrc(p);
    @let preview = hoverPreview(p);
    @let isHovered = hovered() === p.id;

    <button
      type="button"
      class="tile"
      [class.is-broken]="isBroken(p)"
      [attr.data-orientation]="orientation(p)"
      [style.aspect-ratio]="aspectStyle(p)"
      (click)="open.emit(i)"
      (mouseenter)="onEnter(p)"
      (mouseleave)="onLeave()"
      [attr.aria-label]="p.title || 'Открыть работу'"
    >
      <!-- Кадр. Если постера нет — сам ролик с preload=metadata: браузер
           покажет первый кадр, и он же даст нам размеры для aspect-ratio. -->
      @if (poster && !isBroken(p)) {
        <img
          class="frame"
          [src]="poster"
          [alt]="p.title || 'Кадр работы'"
          loading="lazy"
          decoding="async"
          appMeasureAspect
          (measured)="setRatio(p, $event)"
          (error)="markBroken(p)"
        />
      } @else if (p.video_url && !isBroken(p)) {
        <video
          class="frame"
          [src]="p.video_url"
          preload="metadata"
          muted
          playsinline
          appMeasureAspect
          (measured)="setRatio(p, $event)"
          (error)="markBroken(p)"
        ></video>
      } @else {
        <!-- Фолбэк вместо голого чёрного прямоугольника. -->
        <span class="frame frame--fallback" aria-hidden="true">
          <span nz-icon [nzType]="p.kind === 'image' ? 'picture' : 'video-camera'"></span>
        </span>
      }

      <!-- Hover-автоплей (только desktop). Animated webp предпочтительнее:
           играет через <img>, мимо autoplay-политик и Low Power Mode. -->
      @if (isHovered && preview) {
        @if (preview.kind === 'img') {
          <img class="frame frame--hover" [src]="preview.src" alt="" aria-hidden="true" />
        } @else {
          <video
            class="frame frame--hover"
            [src]="preview.src"
            autoplay
            muted
            loop
            playsinline
          ></video>
        }
      }

      <span class="scrim" aria-hidden="true"></span>

      @if (formatBadge(p)) {
        <span class="badge badge--format">{{ formatBadge(p) }}</span>
      }
      @if (durationBadge(p)) {
        <span class="badge badge--duration">{{ durationBadge(p) }}</span>
      } @else if (p.kind === 'image' && photoCount(p) > 1) {
        <span class="badge badge--duration">{{ photoCount(p) }} фото</span>
      }

      @if (p.kind !== 'image') {
        <span class="play" aria-hidden="true">
          <svg viewBox="0 0 16 18" width="15" height="17" fill="#fff">
            <path d="M0 0l16 9L0 18z" />
          </svg>
        </span>
      }

      <span class="cap">
        @if (p.title) {
          <span class="cap__title">{{ p.title }}</span>
        }
        @if (tags(p).length) {
          <span class="cap__tags">
            @for (t of tags(p); track t) {
              <span class="wtag">{{ t }}</span>
            }
          </span>
        }
      </span>
    </button>
  }
</div>
