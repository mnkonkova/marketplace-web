<div class="aside-stack">
  @if (shareUrl()) {
    <app-share-card
      [url]="shareUrl()"
      [displayName]="profile().display_name"
      [roles]="shareRoles()"
      [worksCount]="worksCount()"
      [coverUrl]="shareCover()"
    />
  }

  <!-- «Где найти» только когда есть что показать: пустая рамка с заголовком
       выглядит как сломанная вёрстка, а не как «контактов нет». -->
  @if (hasContacts()) {
    <nz-card nzTitle="Где найти" class="aside-card">
      <app-social-row [social]="profile().social_links!" />
    </nz-card>
  }

  <nz-card nzTitle="Стоимость услуг" class="aside-card">
    <ul class="price-list">
      <li>
        <span>Работа специалиста</span>
        <strong>{{ rateLabel() }}</strong>
      </li>
    </ul>
  </nz-card>

  <!-- TODO Занятость и среднее время ответа: пока хардкод-заглушки, скрываем
       до тех пор пока бэк не отдаёт реальные значения (нужен трекинг
       last_seen + статус «свободен/занят» в profile + расчёт avg response
       time по leads). См. backlog «specialist availability». -->
</div>
