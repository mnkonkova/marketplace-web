<div class="aside-stack">
  @if (profile().social_links; as soc) {
    <nz-card nzTitle="Где найти" class="aside-card">
      <app-social-row [social]="soc" />
    </nz-card>
  }

  <nz-card nzTitle="Стоимость услуг" class="aside-card">
    <ul class="price-list">
      <li>
        <span>Работа специалиста</span>
        <strong>{{
          formatRate(profile().rate_min, profile().rate_max, profile().currency)
        }}</strong>
      </li>
    </ul>
  </nz-card>

  <!-- TODO Занятость и среднее время ответа: пока хардкод-заглушки, скрываем

       last_seen + статус «свободен/занят» в profile + расчёт avg response
       time по leads). См. backlog «specialist availability». -->

</div>
