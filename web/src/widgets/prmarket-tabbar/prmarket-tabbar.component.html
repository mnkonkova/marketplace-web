<nav class="tabbar" [style.grid-template-columns]="'repeat(' + tabs().length + ',minmax(0,1fr))'">
  @for (t of tabs(); track t.key) {
    <button
      type="button"
      class="tab"
      [attr.aria-current]="t.key === current() ? 'page' : null"
      (click)="pick.emit(t.key)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @switch (t.icon) {
          @case ('grid') {
            <rect x="3.5" y="3.5" width="7" height="7" rx="1.8" />
            <rect x="13.5" y="3.5" width="7" height="7" rx="1.8" />
            <rect x="3.5" y="13.5" width="7" height="7" rx="1.8" />
            <rect x="13.5" y="13.5" width="7" height="7" rx="1.8" />
          }
          @case ('chart') {
            <path d="M4 4v16h16" />
            <path d="M8 15l3.5-4 3 2.5L20 7" />
          }
          @case ('wallet') {
            <rect x="3" y="6" width="18" height="14" rx="2.5" />
            <path d="M3 10h18M16 15h2" />
          }
          @case ('chat') {
            <path d="M4 5h16v11H10l-6 4z" />
          }
          @case ('cal') {
            <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
            <path d="M3.5 10h17M8 3v4M16 3v4" />
          }
          @case ('doc') {
            <path d="M6 3h8.5L19 7.5V21H6z" />
            <path d="M14 3v5h5M9 13h7M9 17h5" />
          }
          @case ('bell') {
            <path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z" />
            <path d="M10 20.5a2 2 0 0 0 4 0" />
          }
          @case ('check') {
            <rect x="3.5" y="3.5" width="17" height="17" rx="4" />
            <path d="M8 12.5l2.8 2.8L16.5 9" />
          }
          @case ('users') {
            <circle cx="9" cy="8" r="3.5" />
            <path d="M2.5 20c.6-3.8 3-5.8 6.5-5.8s5.9 2 6.5 5.8" />
            <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M17.8 14.4c2 .7 3.3 2.6 3.7 5.6" />
          }
          @case ('coin') {
            <circle cx="12" cy="12" r="8.5" />
            <path d="M14.8 9.2c-.5-1-1.5-1.5-2.8-1.5-1.6 0-2.8.8-2.8 2.1 0 2.8 5.8 1.6 5.8 4.4 0 1.3-1.2 2.2-3 2.2-1.4 0-2.5-.6-3-1.6M12 6v1.7M12 16.4V18" />
          }
        }
      </svg>
      @if (t.badge) {
        <span class="badge">{{ t.badge }}</span>
      }
      <span class="t">{{ t.title }}</span>
    </button>
  }
</nav>
