<!--
  Панель «Статус публикации» убрана: она слово в слово повторяла баннер в
  шапке, который виден на всех вкладках. Кнопка «Как видят клиенты» переехала
  туда же — там она рядом с текстом про проверку, а не через экран от него.
-->
<section class="panel">
  <app-profile-share
    #share
    [username]="profile().username || ''"
    [userId]="profile().user_id"
    [displayName]="profile().display_name"
    (usernameChange)="usernameChange.emit($event)"
  />
  @if (!profile().is_published) {
    <p class="hint">
      Username можно занять уже сейчас — ссылка начнёт открываться для клиентов после публикации и
      одобрения.
    </p>
  }
</section>
