<form class="project-dialog" [formGroup]="form" (ngSubmit)="submit()">
  <h3>Начать бриф</h3>

  <div class="lead-target">
    Получатели ({{ specialists().length }}):
    <ul class="lead-target-list">
      @for (s of specialists(); track s.user_id) {
      <li>· {{ s.display_name }}</li>
      }
    </ul>
  </div>

  <label>
    Ваше имя
    <input formControlName="client_name" autocomplete="name" />
  </label>

  <label>
    Контакт (email или telegram)
    <input formControlName="client_contact" autocomplete="email" />
  </label>

  <label>
    Название задачи (бриф)
    <textarea formControlName="brief" rows="4"></textarea>
  </label>

  <div class="row">
    <label>
      Бюджет от
      <input formControlName="budget_min" type="number" min="0" />
    </label>
    <label>
      до
      <input formControlName="budget_max" type="number" min="0" />
    </label>
  </div>

  <label class="deadline-field">
    Дедлайн
    <nz-date-picker
      formControlName="deadline"
      class="deadline-picker"
      nzFormat="dd.MM.yyyy"
      nzPlaceHolder="Выберите дату"
      nzAllowClear
      [nzDisabledDate]="disabledPastDates"
    />
  </label>

  <div class="dialog-actions">
    <button type="button" class="cart-btn-secondary" (click)="modalRef.destroy()">Отмена</button>
    <button type="submit" class="cart-btn-primary" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Отправка…' : 'Отправить' }}
    </button>
  </div>

  @if (error()) {
  <p class="lead-error">{{ error() }}</p>
  }
</form>
