<section class="panel">
  <div class="panel-head">
    <div>
      <h2>Роли</h2>
      <p>
        Выберите одну или несколько. Звёздочка задаёт основную — именно она стоит первой на
        публичной странице.
      </p>
    </div>
  </div>

  <!--
    Превью «Клиент увидит: …» убрано: оно повторяло сетку ролей строкой ниже,
    и на вкладке было два одинаковых списка. Главная роль и так видна по
    коралловой пилюле, а итог по ней есть под сеткой.
  -->
  <!-- Карточки ролей — общий компонент: тот же в мастере регистрации. -->
  <app-role-picker
    [categoryGroups]="categoryGroups()"
    [categories]="categories()"
    [selectedCategories]="selectedCategories()"
    [primaryCategory]="primaryCategory()"
    (toggled)="categoryToggled.emit($event)"
    (primarySet)="primarySet.emit($event)"
  />
</section>

<!-- Чипы навыков — общий компонент: тот же в мастере регистрации. -->
<app-skill-picker
  [tools]="tools()"
  [platforms]="platforms()"
  [selectedSkills]="selectedSkills()"
  (toggled)="skillToggled.emit($event)"
/>
