<form [formGroup]="form" (ngSubmit)="submit()" class="cr">
  <h2>Найдите команду под задачу</h2>
  <p class="cr-sub">
    Аккаунт нужен, чтобы заявка не потерялась и вы видели ответы команд в одном месте.
  </p>

  <label class="cr-field">
    Как к вам обращаться
    <input nz-input nzSize="large" formControlName="display_name" placeholder="Имя или компания" />
  </label>

  <label class="cr-field">
    Email
    <input
      nz-input
      nzSize="large"
      type="email"
      autocomplete="email"
      formControlName="email"
      placeholder="you@example.com"
    />
  </label>

  <label class="cr-field">
    Пароль
    <input
      nz-input
      nzSize="large"
      type="password"
      autocomplete="new-password"
      formControlName="password"
      placeholder="Не короче 8 символов"
    />
    @if (form.controls.password.value?.length && form.controls.password.invalid) {
    <span class="cr-hint"
      >Ещё {{ 8 - (form.controls.password.value?.length ?? 0) }} символа — минимум 8.</span
    >
    }
  </label>

  @if (backendError()) {
  <p class="cr-err">{{ backendError() }}</p>
  } @if (yandexEnabled) {
  <button
    type="button"
    class="cr-yandex"
    [disabled]="!form.controls.consent.value"
    (click)="loginYandex()"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path
        d="M13.3 21V13.2L8.6 21H4.9l5.2-8.4C7.7 11.5 6.2 9.6 6.2 6.9 6.2 3.6 8.5 1.5 12 1.5h5.1V21h-3.8zm0-16.4h-1.2c-1.6 0-2.9 1-2.9 3.1 0 2 1.1 3 2.9 3h1.2V4.6z"
      />
    </svg>
    Продолжить с Яндексом
  </button>
  <p class="cr-or">или заполните форму</p>
  }

  <!-- Согласие явной галочкой: акцепт по действию недоказуем. -->
  <label class="cr-consent">
    <input type="checkbox" formControlName="consent" />
    <span>
      Я принимаю
      <a href="/terms" target="_blank" rel="noopener">соглашение и оферту</a>
      и
      <a href="/privacy" target="_blank" rel="noopener">политику конфиденциальности</a>
    </span>
  </label>

  <button
    nz-button
    nzType="primary"
    nzSize="large"
    type="submit"
    class="cr-submit"
    [nzLoading]="loading()"
    [disabled]="!form.controls.consent.value"
  >
    Найти команду
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <div class="cr-links">
    <span>
      Уже есть аккаунт?
      <button type="button" class="cr-link" (click)="openLogin()">Войти</button>
    </span>
    <button type="button" class="cr-link" (click)="goSpecialist()">
      Я специалист, хочу профиль
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</form>
