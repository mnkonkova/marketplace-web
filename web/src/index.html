    <!-- Favicon: ICO для Яндекса (он SVG не подхватывает), SVG для
         современных браузеров, apple-touch-icon для iOS home-screen,
         PWA-manifest с 192/512 PNG для Android. Все файлы лежат в
         /public/ и копируются Angular CLI'ем в корень dist/.
         Регенерация: cd web/public && python3 -c "..." (см. commit msg). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>

  </body>
