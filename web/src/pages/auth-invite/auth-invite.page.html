<app-header />

<main class="invite">
  @if (state() === 'loading') {
    <nz-spin nzSize="large"></nz-spin>
    <p>Принимаем ссылку...</p>
  } @else if (state() === 'ok') {
    <p>Готово! Перенаправляем в кабинет.</p>
  } @else {
    <h2>Ссылка недействительна</h2>
    <p>Возможно она устарела или уже использована. Попросите менеджера выслать новую.</p>
  }
</main>
