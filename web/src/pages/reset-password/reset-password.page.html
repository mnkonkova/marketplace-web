<app-header />
<main class="reset-page">
  <div class="reset-card">
    <h1>Новый пароль</h1>
    @if (!token()) {
    <p class="reset-error">
      Ссылка некорректна или устарела. Запросите новый сброс пароля на странице входа.
    </p>
    <a routerLink="/" class="reset-back">← На главную</a>
    } @else {
    <p class="reset-hint">Придумайте новый пароль для входа в аккаунт.</p>
    <form nz-form [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-control nzErrorTip="Минимум 8 символов">
          <nz-input-group [nzSuffix]="suffixTpl">
            <input
              [type]="passwordVisible() ? 'text' : 'password'"
              nz-input
              placeholder="Новый пароль"
              formControlName="password"
            />
          </nz-input-group>
          <ng-template #suffixTpl>
            <span
              nz-icon
              class="ant-input-password-icon"
              [nzType]="passwordVisible() ? 'eye-invisible' : 'eye'"
              (click)="togglePassword()"
            ></span>
          </ng-template>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control>
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            nz-input
            placeholder="Повторите пароль"
            formControlName="confirm"
          />
        </nz-form-control>
      </nz-form-item>
      <button
        nz-button
        nzType="primary"
        nzBlock
        [nzLoading]="loading()"
        [disabled]="form.invalid"
      >
        Сохранить и войти
      </button>
    </form>
    }
  </div>
</main>
