<app-page-head
  title="Входящие"
  subtitle="Проекты без ответственного: возьмите на себя, чтобы вести его дальше."
/>

<app-list-state
  [loading]="loading()"
  [error]="error()"
  [empty]="projects().length === 0"
  emptyText="Пусто — все проекты разобраны."
  (retry)="fetch()"
>
  <div class="cards">
    @for (p of projects(); track p.id) {
    <article class="card">
      <header>
        <h3>{{ p.title }}</h3>
        <app-status-tag [tone]="statusTone(p.display_status)">
          {{ statusLabel(p.display_status) }}
        </app-status-tag>
      </header>
      @if (p.client_display_name) {
      <p class="meta">Клиент: {{ p.client_display_name }}</p>
      } @if (p.current_stage_name) {
      <p class="meta">Стадия: {{ p.current_stage_name }}</p>
      }
      <button nz-button nzType="primary" block [nzLoading]="claiming() === p.id" (click)="claim(p)">
        Взять на себя
      </button>
    </article>
    }
  </div>
</app-list-state>
