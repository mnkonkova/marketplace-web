<app-admin-layout>
  <header class="head">
    <h1>Воронки</h1>
    <button nz-button nzType="primary" (click)="openCreate(createTpl)">+ Создать</button>
  </header>

  <nz-table [nzData]="items()" nzSize="middle">
    <thead>
      <tr>
        <th>Название</th>
        <th>Версия</th>
        <th>Правки</th>
        <th>Статус</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (p of items(); track p.id) {
        <tr (click)="open(p)" style="cursor: pointer">
          <td data-label="Название">{{ p.name }}</td>
          <td data-label="Версия">v{{ p.version }}</td>
          <td data-label="Правки">{{ p.revisions_included }}</td>
          <td data-label="Статус">
            @if (p.is_active) {
              <nz-tag nzColor="green">Активна</nz-tag>
            } @else {
              <nz-tag>Деактивирована</nz-tag>
            }
            @if (p.is_default) {
              <nz-tag nzColor="gold">★ Default</nz-tag>
            }
          </td>
          <td (click)="$event.stopPropagation()">
            <button nz-button nzSize="small" (click)="open(p)">Открыть</button>
            @if (!p.is_default && p.is_active) {
              <button
                nz-button
                nzSize="small"
                nzType="dashed"
                style="margin-left: 6px"
                [nzLoading]="busyId() === p.id"
                [disabled]="!!busyId()"
                (click)="makeDefault(p)"
              >
                Сделать default
              </button>
            }
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</app-admin-layout>

<ng-template #createTpl>
  <label>Название</label>
  <input nz-input [(ngModel)]="name" />
  <label style="margin-top: 12px; display: block">Описание</label>
  <textarea nz-input rows="2" [(ngModel)]="description"></textarea>
  <label style="margin-top: 12px; display: block">Включено правок</label>
  <nz-input-number [(ngModel)]="revisions" [nzMin]="0" [nzMax]="50"></nz-input-number>
</ng-template>
