<app-page-head
  title="Воронки продакшна"
  subtitle="Шаблон шагов проекта. Проект снимает воронку копией на старте — правка здесь идущих проектов не трогает."
>
  <button head-action nz-button nzType="primary" nzSize="small" (click)="openCreate(createTpl)">
    Создать воронку
  </button>
</app-page-head>

<app-list-state
  [loading]="loading()"
  [error]="error()"
  [empty]="items().length === 0"
  emptyText="Воронок ещё нет. Пока их нет, проект продакшна создать не из чего."
  (retry)="fetch()"
>
  <nz-table [nzData]="items()" nzSize="middle">
    <thead>
      <tr>
        <th>Название</th>
        <th>Версия</th>
        <th>Лимит правок</th>
        <th>Статус</th>
        <th class="r"></th>
      </tr>
    </thead>
    <tbody>
      @for (p of items(); track p.id) {
      <!-- Строка целиком — ссылка на редактор: попадать в одну кнопку
             «Открыть» в последней колонке мышью неудобно, а на тач-экране
             почти невозможно. -->
      <tr class="row" (click)="open(p)" tabindex="0" (keydown.enter)="open(p)">
        <td data-label="Название">
          <b>{{ p.name }}</b>
        </td>
        <td data-label="Версия" class="num">{{ versionLabel(p) }}</td>
        <!-- «Правки» — это не правки воронки, а сколько правок включено в
               проект по ней. Колонку читали наоборот. -->
        <td data-label="Лимит правок" class="num">{{ p.revisions_included }}</td>
        <td data-label="Статус">
          @if (p.is_active) {
          <app-status-tag tone="ok">Активна</app-status-tag>
          } @else {
          <app-status-tag tone="neutral">Выключена</app-status-tag>
          } @if (p.is_default) {
          <app-status-tag tone="neutral">по умолчанию</app-status-tag>
          }
        </td>
        <td data-label="" class="r">
          <app-row-menu
            [items]="menuFor(p)"
            [label]="'Действия: ' + p.name"
            (pick)="onPick(p, $event)"
          />
        </td>
      </tr>
      }
    </tbody>
  </nz-table>
</app-list-state>

<ng-template #createTpl>
  <label>Название</label>
  <input nz-input [(ngModel)]="name" />
  <label style="margin-top: 12px; display: block">Описание</label>
  <textarea nz-input rows="2" [(ngModel)]="description"></textarea>
  <label style="margin-top: 12px; display: block">Включено правок</label>
  <nz-input-number [(ngModel)]="revisions" [nzMin]="0" [nzMax]="50"></nz-input-number>
</ng-template>
