<app-page-head
  title="Продакшены"
  subtitle="Студии, к которым привязаны специалисты. Выключенный продакшен остаётся в старых профилях, но выбрать его в новых нельзя."
>
  <button head-action nz-button nzType="primary" nzSize="small" (click)="openCreate(createTpl)">
    Создать продакшен
  </button>
</app-page-head>

<app-list-state
  [loading]="loading()"
  [error]="error()"
  [empty]="items().length === 0"
  emptyText="Продакшенов ещё нет — специалисту нечего выбрать, кроме фриланса."
  (retry)="fetch()"
>
  <nz-table [nzData]="items()" nzSize="middle">
    <thead>
      <tr>
        <th>Название</th>
        <th>Описание</th>
        <th>Статус</th>
        <th class="r"></th>
      </tr>
    </thead>
    <tbody>
      @for (p of items(); track p.id) {
      <tr>
        <td data-label="Название">
          <b>{{ p.name }}</b>
        </td>
        <td data-label="Описание">{{ p.description || '—' }}</td>
        <td data-label="Статус">
          @if (p.is_active) {
          <app-status-tag tone="ok">Активен</app-status-tag>
          } @else {
          <app-status-tag tone="neutral">Выключен</app-status-tag>
          }
        </td>
        <td data-label="" class="r">
          <app-row-menu
            [items]="menuFor(p)"
            [label]="'Действия: ' + p.name"
            (pick)="onPick(p, $event)"
          />
        </td>
      </tr>
      }
    </tbody>
  </nz-table>
</app-list-state>

<ng-template #createTpl>
  <label>Название</label>
  <input nz-input [(ngModel)]="name" />
  <label style="margin-top: 12px; display: block">Описание</label>
  <textarea nz-input rows="3" [(ngModel)]="description"></textarea>
</ng-template>
