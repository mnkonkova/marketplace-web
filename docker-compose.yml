# Локальный dev: статика фронта через Caddy на :8081, /api/* проксируется
# на API, который ждём на хосте (host.docker.internal:8080).
# Перед запуском: npm ci && npm run build:css (стили попадают в web/styles.css).
services:
  web:
    image: caddy:2-alpine
    ports:
      - "8081:80"
    environment:
      DOMAIN: ":80"
      API_UPSTREAM: "host.docker.internal:8080"
    volumes:
      - ./web:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
